version: 2
models:
  - name: stg_measurements
    description: One row per scene per cell from the silver Delta table.
    columns:
      - name: scene_id
        data_tests: [not_null]
      - name: cell_idx
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [scene_id, cell_idx]
  - name: stg_cells
    columns:
      - name: cell_idx
        data_tests: [unique, not_null]
  - name: stg_scenes
    columns:
      - name: scene_id
        tests: [unique, not_null]