version: 2
models:
  - name: dim_region
    description: One row per H3 res-7 cell covering tile 17TPJ.
    columns:
      - name: cell_idx
        data_tests: [unique, not_null]
      - name: water_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100, inclusive: true}
  - name: dim_scene
    columns:
      - name: scene_id
        data_tests: [unique, not_null]
      - name: cloud_cover
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100, inclusive: true}
  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]
  - name: fact_measurement
    description: One row per scene per cell with at least one valid pixel.
    columns:
      - name: cell_idx
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_region'), field: cell_idx}
      - name: scene_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_scene'), field: scene_id}
      - name: observed_on
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: ndvi_mean
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: -1, max_value: 1, inclusive: true}
      - name: coverage_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100, inclusive: true}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [scene_id, cell_idx]