name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      S2_BUCKET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
      - run: cd dbt && uv run dbt deps && uv run dbt parse
  dag-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.airflow -t s2-airflow .
      - run: |
          docker run --rm -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -v "$PWD/airflow/dags:/opt/airflow/dags" s2-airflow python -c "
          from airflow.dag_processing.dagbag import DagBag
          b = DagBag('/opt/airflow/dags')
          assert not b.import_errors, b.import_errors
          assert 's2_daily' in b.dags, list(b.dags)
          print('dags ok:', list(b.dags))"